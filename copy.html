<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Salin Rekening</title>

  <style>

    body{
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #ffffff;
      font-family: sans-serif;
    }

    button{
      background: #364d39;
      color: white;
      border: none;
      padding: 15px 28px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
    }

  </style>
</head>

<body>

<button onclick="copyRekening()">
  Salin
</button>

<script>

function copyRekening() {

  navigator.clipboard.writeText("1840002358990");

  const popup = document.createElement("div");

  popup.innerText = "Nomor rekening berhasil disalin";

  popup.style.position = "fixed";
  popup.style.bottom = "30px";
  popup.style.left = "50%";
  popup.style.transform = "translateX(-50%)";

  popup.style.background = "#364d39";
  popup.style.color = "white";

  popup.style.padding = "14px 22px";

  popup.style.borderRadius = "12px";

  popup.style.fontSize = "14px";

  popup.style.fontFamily = "sans-serif";

  popup.style.zIndex = "9999";

  document.body.appendChild(popup);

  setTimeout(() => {
    popup.remove();
  }, 2000);

}

</script>

</body>
</html>
